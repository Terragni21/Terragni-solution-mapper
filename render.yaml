services:
  - type: web
    name: terragni-solution-mapper
    runtime: python
    region: singapore
    plan: starter

    rootDir: .
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding('nomic-ai/nomic-embed-text-v1')"
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT

    healthCheckPath: /

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: JOURNEY_GROQ_MAX_COMPLETION_TOKENS
        value: "2500"

      - key: JOURNEY_GROQ_REASONING_EFFORT
        value: low

      - key: FLASK_DEBUG
        value: "false"

      - key: TOP_K_CHUNKS
        value: "10"

      - key: MAX_CHUNK_CHARS
        value: "4500"

      - key: FASTEMBED_MODEL
        value: nomic-ai/nomic-embed-text-v1

      - key: DB_EMBEDDING_MODEL
        value: nomic-embed-text

      - key: EMBEDDING_CACHE_SECONDS
        value: "900"

      - key: JOURNEY_RETRIEVAL_TOP_K
        value: "24"

      - key: JOURNEY_RETRIEVAL_MIN_SIMILARITY
        value: "0.45"

      - key: JOURNEY_RETRIEVAL_MAX_EVIDENCE
        value: "12"

      - key: JOURNEY_RETRIEVAL_MAX_CASE_STUDIES
        value: "8"