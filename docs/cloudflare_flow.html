<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Cloudflare Tunnel Works</title>
<style>
:root{--bg:#ffffff;--text:#1f1e1c;--muted:#5f5e5a;--line:#b4b2a9;--accent:#534AB7}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
svg text{font-family:Segoe UI,Arial,sans-serif}
.dim{opacity:.22;transition:opacity .3s}.lit{opacity:1;transition:opacity .3s}
.flow{stroke-dasharray:6 5}
@media (prefers-reduced-motion:no-preference){@keyframes mv{to{stroke-dashoffset:-22}}.lit.flow{animation:mv 1s linear infinite}}
#dots{display:flex;gap:6px;margin:14px 0 10px}#dots span{width:9px;height:9px;border-radius:50%;background:#d3d1c7}
#t{font-weight:600;font-size:17px;margin:0 0 6px}#x{margin:0;color:var(--muted);line-height:1.7;min-height:80px;font-size:15px}
button{font:inherit;padding:8px 18px;border:1px solid #888780;background:#fff;border-radius:8px;cursor:pointer;margin-right:8px}
button:hover{background:#f1efe8}
</style>
</head>
<body><div class="wrap">
<h1>How the website reaches users through Cloudflare</h1>
<p class="sub">Click Next to go through each step.</p>
<svg width="100%" viewBox="0 0 680 370" role="img" aria-label="Cloudflare Tunnel flow">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect x="390" y="40" width="250" height="290" rx="16" fill="none" stroke="#5f5e5a" stroke-dasharray="5 4"/>
<text x="515" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">Office 24x7 system</text>
<line x1="372" y1="40" x2="372" y2="330" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="372" y="352" text-anchor="middle" font-size="12" fill="#993C1D">Office firewall (stays closed)</text>
<g id="n-visitor" class="dim"><rect x="40" y="120" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="95" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Visitor</text><text x="95" y="162" text-anchor="middle" font-size="12" fill="#5F5E5A">Any location</text></g>
<g id="n-cf" class="dim"><rect x="195" y="110" width="150" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="270" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Cloudflare</text><text x="270" y="156" text-anchor="middle" font-size="12" fill="#534AB7">Login check</text><text x="270" y="173" text-anchor="middle" font-size="12" fill="#534AB7">Blocks strangers</text></g>
<g id="n-groq" class="dim"><rect x="195" y="250" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="270" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Groq AI</text><text x="270" y="292" text-anchor="middle" font-size="12" fill="#5F5E5A">Writes the answer</text></g>
<g id="n-tun" class="dim"><rect x="410" y="80" width="210" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="515" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">cloudflared (tunnel)</text></g>
<g id="n-web" class="dim"><rect x="410" y="150" width="210" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="515" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Website</text></g>
<g id="n-db" class="dim"><rect x="410" y="220" width="210" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="515" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Oracle database</text></g>
<line id="a-vc" class="dim" x1="152" y1="148" x2="191" y2="148" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
<path id="a-tun" class="dim flow" d="M347 128 L406 102" fill="none" stroke="#1D9E75" stroke-width="3" marker-end="url(#ar)"/>
<line id="a-tw" class="dim" x1="515" y1="126" x2="515" y2="146" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
<line id="a-wd" class="dim" x1="515" y1="196" x2="515" y2="216" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
<path id="a-wg" class="dim" d="M408 186 L382 186 L382 278 L349 278" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
<div id="dots"></div>
<p id="t"></p><p id="x"></p>
<button id="prev">Back</button><button id="next">Next</button>
</div>
<script>
const S=[
["Morning: the office system starts",["n-tun","n-web","n-db","a-tun","n-cf"],"The 24x7 office system starts Oracle, the website and cloudflared automatically. cloudflared makes an outgoing call to Cloudflare and keeps that secure line open. Nothing is opened in the office firewall."],
["A visitor opens the link",["n-visitor","n-cf","a-vc"],"A client types mapper.terragni.co. Their browser only ever reaches Cloudflare. They never learn where our office or our computer is."],
["Login check",["n-visitor","n-cf","a-vc"],"Cloudflare Access asks for their email and sends a one-time code. Approved emails get in. Anyone else, including hackers, is stopped right here and never reaches our system."],
["The question travels through the tunnel",["n-cf","a-tun","n-tun","a-tw","n-web"],"The visitor asks a question. Cloudflare passes it down the already-open, encrypted tunnel to cloudflared, which hands it to our website on the office system."],
["The website searches our database",["n-web","a-wd","n-db"],"The website looks up matching case studies in Oracle. This happens inside the same office computer. The database is never connected to the internet."],
["Groq writes the answer",["n-web","a-wg","n-groq"],"The website sends the question plus short text extracts to Groq, which writes the answer. Groq does not store our database. This is the only part that goes online, same as today."],
["The answer goes back",["n-web","n-tun","a-tw","a-tun","n-cf","a-vc","n-visitor"],"The finished answer travels back up the tunnel to Cloudflare and on to the visitor's screen. Total time: a few seconds."],
["If the office system is switched off",["n-cf","n-visitor","a-vc"],"The tunnel closes, so Cloudflare simply shows 'site unavailable'. Nothing is exposed. When the system starts again, everything reconnects by itself."]
];
const all=["n-visitor","n-cf","n-groq","n-tun","n-web","n-db","a-vc","a-tun","a-tw","a-wd","a-wg"];
let i=0;const dots=document.getElementById('dots');
S.forEach(()=>dots.appendChild(document.createElement('span')));
function show(){const [t,on,x]=S[i];document.getElementById('t').textContent=(i+1)+'. '+t;document.getElementById('x').textContent=x;
all.forEach(id=>{const e=document.getElementById(id);const l=on.includes(id);e.classList.toggle('lit',l);e.classList.toggle('dim',!l)});
[...dots.children].forEach((d,k)=>d.style.background=k===i?'#534AB7':'#d3d1c7');
document.getElementById('next').textContent=i===S.length-1?'Start again':'Next';}
document.getElementById('next').onclick=()=>{i=(i+1)%S.length;show()};
document.getElementById('prev').onclick=()=>{i=(i-1+S.length)%S.length;show()};
show();
</script>
</body></html>
